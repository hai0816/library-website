{% extends 'base.html' %}
{% block title %}Đổi mật khẩu - LibNet{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="glass-card auth-card">
        <h2 class="mb-3">Đổi mật khẩu</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Mật khẩu hiện tại</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu mới</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Xác nhận mật khẩu mới</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-accent w-100">Cập nhật mật khẩu</button>
            <a href="{{ url_for('user.profile') }}" class="btn btn-outline-light w-100 mt-2">Quay lại hồ sơ</a>
        </form>
    </div>
</div>
{% endblock %}
